[build]
  command = "cat cashlender-package.part* > /tmp/cashlender.b64 && base64 -d /tmp/cashlender.b64 > /tmp/cashlender.zip && unzip -oq /tmp/cashlender.zip -d ."
  publish = "CashLender-Supabase-Netlify"

[functions]
  directory = "CashLender-Supabase-Netlify/netlify/functions"
  node_bundler = "esbuild"
