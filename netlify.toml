[build]
  command = "cat cashlender-pin-v5.part* > /tmp/cashlender-pin-v5.b64 && base64 -d /tmp/cashlender-pin-v5.b64 > /tmp/cashlender-pin-v5.zip && unzip -oq /tmp/cashlender-pin-v5.zip -d . && python3 pin-frontpage-build.py"
  publish = "CashLender-Supabase-Netlify"

[functions]
  directory = "CashLender-Supabase-Netlify/netlify/functions"
  node_bundler = "esbuild"
