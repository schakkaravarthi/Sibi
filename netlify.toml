[build]
  command = "cat cashlender-package.part* > /tmp/cashlender.b64 && base64 -d /tmp/cashlender.b64 > /tmp/cashlender.zip && unzip -oq /tmp/cashlender.zip -d . && sed -i 's|</head>|<style>header h1 span:first-child{color:#facc15!important;font-weight:800!important}</style></head>|' CashLender-Supabase-Netlify/index.html"
  publish = "CashLender-Supabase-Netlify"

[functions]
  directory = "CashLender-Supabase-Netlify/netlify/functions"
  node_bundler = "esbuild"
